name: Backend CI (Go)

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test-and-build:
    name: Test & Build Go Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Run Tests
        run: go test -v -race ./...

      - name: Build Binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/craftopia-server ./cmd/server
