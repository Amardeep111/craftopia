services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: craftopia-go-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/jamaes_craftopia?sslmode=disable
      - JWT_SECRET=dev-secret-key-change-in-production
      - MERCHANT_UPI_ID=amardeepsarkar8@okhdfcbank
      - MERCHANT_PAYEE_NAME=Jamae's Craftopia
      - WHATSAPP_CONTACT_NUMBER=916909476388
      - CORS_ORIGIN=*
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: craftopia-go-postgres
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=jamaes_craftopia
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

